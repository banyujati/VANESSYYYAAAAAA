<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ada surat buat kamu 💌</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💌</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,400&family=Caveat:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --night:#0f1230; --night2:#1d1b4b; --paper:#f6f1f7; --ink:#2b2340;
  --rose:#c23a67; --rose-d:#8f2449; --env:#d8cde6; --env-d:#bfb0d4; --moon:#f3e9c8;
  --serif:'Fraunces',Georgia,serif; --hand:'Caveat','Segoe Script',cursive;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:radial-gradient(ellipse at 50% 0%,var(--night2),var(--night) 70%);color:var(--moon);font-family:var(--serif);overflow:hidden}
canvas#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.moon{position:fixed;top:7vh;right:9vw;width:56px;height:56px;border-radius:50%;z-index:0;background:var(--moon);box-shadow:0 0 40px 10px rgba(243,233,200,.25)}

/* ---------- amplop ---------- */
#stage{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.2rem;padding:1.5rem;text-align:center;transition:opacity .9s,transform .9s}
#stage.gone{opacity:0;transform:scale(.9);pointer-events:none}
#stage h1{font-weight:400;font-style:italic;font-size:clamp(1.5rem,5vw,2.1rem);line-height:1.3;max-width:20ch}
.runner{transition:transform .55s cubic-bezier(.34,1.56,.64,1)}
.envelope{position:relative;display:block;width:min(320px,80vw);aspect-ratio:3/2;perspective:900px;cursor:pointer;background:none;border:0;font:inherit;color:inherit;filter:drop-shadow(0 18px 30px rgba(0,0,0,.45))}
.envelope:focus-visible{outline:3px solid var(--moon);outline-offset:8px}
.env-back,.env-front{position:absolute;inset:0;border-radius:6px}
.env-back{background:var(--env-d)}
.env-front{background:var(--env);clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%)}
.flap{position:absolute;left:0;right:0;top:0;height:58%;background:var(--env);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform 1.1s ease,z-index 0s .55s;z-index:3;border-radius:6px 6px 0 0}
.seal{position:absolute;left:50%;top:58%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;z-index:4;background:radial-gradient(circle at 35% 30%,#e0557f,var(--rose) 55%,var(--rose-d));display:grid;place-items:center;font-size:22px;box-shadow:0 3px 8px rgba(0,0,0,.35);transition:opacity .3s}
.envelope.open .flap{transform:rotateX(180deg);z-index:1}
.envelope.open .seal{opacity:0}
.hint{font-size:1rem;opacity:.85;min-height:1.6em;max-width:28ch}
@media (prefers-reduced-motion:no-preference){
  .envelope:not(.open){animation:bob 3.2s ease-in-out infinite}
  .envelope.shake{animation:shake .45s}
  @keyframes bob{50%{transform:translateY(-8px)}}
  @keyframes shake{20%{transform:rotate(-6deg)}40%{transform:rotate(6deg)}60%{transform:rotate(-4deg)}80%{transform:rotate(3deg)}}
}

/* ---------- surat ---------- */
#letter{position:fixed;inset:0;z-index:3;overflow-y:auto;padding:6vh 1rem 32vh;opacity:0;visibility:hidden;transition:opacity 1.2s}
#letter.show{opacity:1;visibility:visible}
.paper{max-width:560px;margin:0 auto;background:var(--paper);color:var(--ink);border-radius:4px;padding:clamp(1.6rem,6vw,3rem);box-shadow:0 30px 60px rgba(0,0,0,.5);background-image:repeating-linear-gradient(transparent 0 39px,rgba(120,100,160,.13) 39px 40px);background-position:0 1.6rem}
.paper h2{font-style:italic;font-weight:400;font-size:clamp(1.6rem,6vw,2.2rem);margin-bottom:1.4rem}
.paper p{font-family:var(--hand);font-size:clamp(1.35rem,4.6vw,1.7rem);line-height:40px;margin-bottom:40px}
.paper .sign{text-align:right;margin-bottom:0}
.blk[hidden]{display:none}
.blk.in{animation:up 1s ease both}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* foto polaroid */
.polaroid{position:relative;width:min(80%,290px);margin:10px auto 52px;background:#fff;padding:10px 10px 12px;box-shadow:0 10px 24px rgba(0,0,0,.3);transform:rotate(var(--r))}
.polaroid::before{content:"";position:absolute;top:-12px;left:50%;width:84px;height:24px;margin-left:-42px;background:rgba(240,200,215,.75);transform:rotate(-3deg);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.polaroid .ph{overflow:hidden;aspect-ratio:4/5;background:#e9e2f0}
.polaroid img{width:100%;height:100%;object-fit:cover;display:block}
.polaroid figcaption{font-family:var(--hand);font-size:1.4rem;text-align:center;padding-top:8px;line-height:1.2;min-height:2.2rem}
@media (prefers-reduced-motion:no-preference){
  .polaroid.in{animation:drop 1.3s cubic-bezier(.2,.8,.3,1) both}
  .polaroid.in img{animation:kb 14s ease-in-out 1.3s infinite alternate}
  @keyframes drop{
    0%{opacity:0;transform:translateY(-160px) rotate(calc(var(--r) + 28deg)) scale(1.2)}
    55%{opacity:1;transform:translateY(10px) rotate(calc(var(--r) - 4deg)) scale(1)}
    75%{transform:translateY(-4px) rotate(calc(var(--r) + 1.5deg))}
    100%{opacity:1;transform:rotate(var(--r))}}
  @keyframes kb{from{transform:scale(1) translate(0,0)}to{transform:scale(1.14) translate(-3%,-2%)}}
}

#next{position:fixed;left:50%;bottom:5vh;transform:translateX(-50%);z-index:6;padding:.8rem 1.6rem;border-radius:99px;border:1px solid rgba(243,233,200,.5);background:rgba(15,18,48,.85);color:var(--moon);font:inherit;font-size:1rem;cursor:pointer;display:none;backdrop-filter:blur(4px)}
#next:focus-visible{outline:3px solid var(--moon);outline-offset:3px}
@media (prefers-reduced-motion:no-preference){#next.on{animation:pulse 2s ease-in-out infinite}@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(243,233,200,.12)}}}
.count{font-style:italic;font-size:.95rem;text-align:center;margin:2.2rem auto 0;max-width:560px;opacity:0;transition:opacity 1.5s}
.count.in{opacity:.85}
#music{position:fixed;right:14px;bottom:14px;z-index:7;width:42px;height:42px;border-radius:50%;border:1px solid rgba(243,233,200,.4);background:rgba(15,18,48,.7);color:var(--moon);font-size:18px;cursor:pointer;display:none}
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<div class="moon" aria-hidden="true"></div>

<section id="stage">
  <h1 id="teaser"></h1>
  <div class="runner" id="runner">
    <button class="envelope" id="env" aria-label="Buka surat">
      <div class="env-back"></div><div class="env-front"></div><div class="flap"></div><div class="seal">♥</div>
    </button>
  </div>
  <p class="hint" id="hint">Ketuk amplopnya</p>
</section>

<main id="letter">
  <article class="paper" id="paper"></article>
  <p class="count" id="count"></p>
</main>

<button id="next"></button>
<button id="music" aria-label="Putar atau jeda musik">♪</button>
<audio id="audio" loop></audio>

<script>
/* =========================================================
   EDIT BAGIAN INI SAJA
   ========================================================= */
const CONFIG = {
  untuk: "ENDUYYYY KUUUU",
  dari: "Aku",
  teaser: "Ada sesuatu buat kamu",
  judul: "Selamat ulang tahun, {untuk}",

  // Pesan jahil tiap kali amplop diketuk. Amplop kabur ke tempat lain tiap ketukan.
  // Setelah semua pesan habis, ketukan berikutnya baru benar-benar buka.
  jahil: [
    "Eits, jangan buru-buru.",
    "Hayo, penasaran ya?",
    "Wleee, amplopnya kabur 😝",
    "Tebak dulu isinya apa...",
    "Oke oke, sekali lagi. Beneran buka nih."
  ],

  // Isi surat. String = paragraf. Objek {foto, caption} = foto polaroid yang "jatuh" ke surat.
  // Taruh file foto di folder yang sama dengan index.html. Kalau file belum ada, muncul kotak placeholder.
  isi: [
    "Jujur, ini pertama kalinya aku nulis surat kayak gini, jadi maaf kalau agak berantakan. Tapi hari ini kamu ulang tahun, dan aku pengin kamu tau satu hal, aku BERSYUKURRR banget bisa kenal kamu.",
    "Baru 73 hari kita jalanin ini. Kalau dihitung pakai angka, emang masih sebentar. Tapi buat aku, 73 hari ini udah ngubah banyak hal.",
    { foto: "47865.jpg", caption: "Sicantik jembatan medan" },
    "Sebelum ada kamu, hari-hariku jujur nggak pernah bener-bener bagus. Aku jarang olahraga, males belajar, dan lebih sering ngurung diri di kamar karena kesepian yang makin numpuk. Terus kamu dateng, dan pelan-pelan semuanya berubah. Sekarang aku bangun dengan semangat, rajin olahraga, dan punya arah buat belajar lagi. Kamu bikin aku pengin jadi versi terbaik dari diriku sendiri.",
    { foto: "47083.jpg", caption: "Sicantik tukang mukbang" },
    "Dan jujur, aku suka banget sama kamu yang apa adanya. Kamu kadang ceplas-ceplos, kadang weird (dalam arti yang paling bagus), dan justru itu yang bikin aku suka. Nggak semua orang berani jadi dirinya sendiri, dan kamu berani. Itu langka, dan aku kagum.",
    "Di umur barumu ini, aku nggak minta yang muluk-muluk. Aku cuma berharap kamu tetep jadi kamu yang ceplas-ceplos dan weird itu, selalu ngerasa cukup, dan nggak pernah ngerasa harus berubah demi siapa pun. Semoga hatimu selalu ringan, dan hari-harimu lebih banyak ketawanya daripada capeknya.",
    "Oh iya, aku tau kamu lagi ngidam banget jenang di Pasar Ngasem. Suatu hari nanti, aku pengin jadi orang yang nemenin kamu duduk di sana, makan jenang bareng, sambil dengerin kamu ceplas-ceplos soal apa aja. Sampai hari itu dateng, aku di sini ya, walau masih lewat layar.",
    "Maaf ya hari ini aku nggak bisa nemenin lama-lama, badanku lagi kurang fit. Tapi sambil istirahat pun, aku tetep pengin nyiapin ini buat kamu.",
    "Selamat ulang tahun sekali lagi, Vanessya. Makasih udah jadi alasan aku mau jadi lebih baik."
  ],
  penutup: "SAYANGGG ENDUYYY.",

  // Tulisan tombol "lanjut", berganti tiap ketukan (muter kalau habis)
  lanjut: ["lanjut", "terus?", "dikit lagi", "masih ada lagi lho", "yang terakhir"],

  tanggalJadian: null,   // contoh: "2024-03-15"
  bukaPada: null,        // contoh: "2026-11-07T00:00:00+07:00"
  musik: null            // contoh: "lagu.mp3"
};
/* ========================================================= */

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const PH = 'data:image/svg+xml,' + encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 500'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#f2b8cc'/><stop offset='1' stop-color='#9c8ad1'/></linearGradient></defs><rect width='400' height='500' fill='url(#g)'/><text x='200' y='290' font-size='120' text-anchor='middle' fill='white' fill-opacity='.8'>♥</text></svg>");

$('teaser').textContent = CONFIG.teaser;

// bangun surat
let n = 0;
const sgn = () => (n++ % 2 ? 1 : -1) * (2 + Math.random() * 3.5);
$('paper').innerHTML =
  `<h2 class="blk">${esc(CONFIG.judul.replace('{untuk}', CONFIG.untuk))}</h2>` +
  CONFIG.isi.map(x => typeof x === 'string'
    ? `<p class="blk" hidden>${esc(x)}</p>`
    : `<figure class="polaroid blk" hidden style="--r:${sgn().toFixed(1)}deg"><div class="ph"><img src="${esc(x.foto)}" alt="${esc(x.caption || '')}" onerror="this.onerror=null;this.src=PH"></div><figcaption>${esc(x.caption || '')}</figcaption></figure>`
  ).join('') +
  `<p class="blk sign" hidden>${esc(CONFIG.penutup)}<br>${esc(CONFIG.dari)} ♥</p>`;

if (CONFIG.tanggalJadian) {
  const d = Math.floor((Date.now() - new Date(CONFIG.tanggalJadian)) / 864e5);
  if (d > 0) $('count').textContent = `Udah ${d} hari kita jalanin ini, beda kota tapi satu langit.`;
}

// kunci sampai waktunya
const env = $('env'), hint = $('hint');
const locked = () => CONFIG.bukaPada && Date.now() < new Date(CONFIG.bukaPada).getTime();
if (locked()) {
  hint.textContent = 'Belum waktunya. Sabar ya, tunggu tengah malam.';
  env.disabled = true; env.style.cursor = 'default';
  const t = setInterval(() => { if (!locked()) { clearInterval(t); env.disabled = false; env.style.cursor = 'pointer'; hint.textContent = 'Ketuk amplopnya'; } }, 1000);
}

// ketukan jahil lalu buka
let taps = 0, opened = false;
env.addEventListener('click', () => {
  if (opened || locked()) return;
  if (taps < CONFIG.jahil.length) {
    hint.textContent = CONFIG.jahil[taps++];
    env.classList.remove('shake'); void env.offsetWidth; env.classList.add('shake');
    if (taps < CONFIG.jahil.length) {           // kabur, kecuali ketukan terakhir
      const mx = Math.max(0, innerWidth / 2 - 175), my = innerHeight * .28;
      const x = (Math.random() * 2 - 1) * mx, y = (Math.random() * 2 - 1) * my;
      $('runner').style.transform = `translate(${x}px,${y}px) rotate(${(Math.random() * 16 - 8).toFixed(1)}deg)`;
    } else {
      $('runner').style.transform = 'none';
    }
    return;
  }
  opened = true;
  env.classList.remove('shake');
  env.classList.add('open');
  hint.style.opacity = 0;
  setTimeout(() => $('stage').classList.add('gone'), 1600);
  setTimeout(() => { $('letter').classList.add('show'); startMusic(); showNext(true); }, 2200);
});

// buka surat per ketukan
const blks = [...document.querySelectorAll('.blk')];
let k = 0;
const nextBtn = $('next');
function reveal(el) {
  el.hidden = false; el.classList.add('in');
  setTimeout(() => el.scrollIntoView({behavior: 'smooth', block: 'center'}), 120);
}
function showNext(first) {
  if (first) { reveal(blks[0]); k = 0; }
  if (k >= blks.length - 1) { nextBtn.style.display = 'none'; $('count').classList.add('in'); return; }
  nextBtn.textContent = CONFIG.lanjut[(k) % CONFIG.lanjut.length];
  nextBtn.style.display = 'block'; nextBtn.classList.add('on');
}
nextBtn.addEventListener('click', () => {
  nextBtn.style.display = 'none';
  reveal(blks[++k]);
  setTimeout(() => showNext(false), blks[k].classList.contains('polaroid') ? 1800 : 1200);
});

// musik
const audio = $('audio'), mbtn = $('music');
if (CONFIG.musik) { audio.src = CONFIG.musik; mbtn.style.display = 'block'; }
function startMusic() { if (CONFIG.musik) audio.play().then(() => mbtn.style.opacity = 1).catch(() => mbtn.style.opacity = .5); }
mbtn.addEventListener('click', () => { if (audio.paused) { audio.play(); mbtn.style.opacity = 1; } else { audio.pause(); mbtn.style.opacity = .5; } });

// langit berbintang
const cv = $('sky'), cx = cv.getContext('2d');
let stars = [];
function size() {
  cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio;
  stars = Array.from({length: Math.round(innerWidth * innerHeight / 7000)}, () => ({
    x: Math.random() * cv.width, y: Math.random() * cv.height,
    r: (Math.random() * 1.2 + .3) * devicePixelRatio, p: Math.random() * 6.28, s: .5 + Math.random() * 1.5
  }));
}
addEventListener('resize', size); size();
const still = matchMedia('(prefers-reduced-motion:reduce)').matches;
function draw(t) {
  cx.clearRect(0, 0, cv.width, cv.height);
  for (const s of stars) {
    cx.globalAlpha = .35 + .65 * (still ? .7 : (Math.sin(t / 1000 * s.s + s.p) + 1) / 2);
    cx.fillStyle = '#f3e9c8';
    cx.beginPath(); cx.arc(s.x, s.y, s.r, 0, 6.28); cx.fill();
  }
  if (!still) requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script>
</body>
</html>
